<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegí tu peluquero | Flama Barber</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="portada reserva">
        <p class="detalle">PASO 1 DE 3</p>
        <h1>Elegí tu peluquero</h1>
        <p class="mensaje">Seleccioná la persona que te atenderá.</p>
        <form method="post">
            <div class="tarjetas-peluqueros">
                {% for peluquero in peluqueros %}
                    <label class="tarjeta-seleccionable">
                        <input name="peluquero_id" type="radio" value="{{ peluquero.id }}" {% if reserva.get('peluquero_id') == peluquero.id|string %}checked{% endif %} required>
                        {% if peluquero.foto %}
                            <img src="{{ peluquero.foto }}" alt="Foto de {{ peluquero.nombre }}">
                        {% else %}
                            <span class="foto-predeterminada">{{ peluquero.nombre[0] }}</span>
                        {% endif %}
                        <strong>{{ peluquero.nombre }}</strong>
                        <small>Especialista en {{ peluquero.especialidades or "cortes personalizados" }}.</small>
                    </label>
                {% endfor %}
            </div>
            <div class="navegacion-pasos">
                <a class="boton-secundario" href="{{ url_for('inicio') }}">Volver</a>
                <button type="submit">Siguiente</button>
            </div>
        </form>
    </main>
</body>
</html>
