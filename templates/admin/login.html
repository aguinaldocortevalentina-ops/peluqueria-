<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso de administración | Flama Barber</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login-body">
    <div class="login-card">
        <img src="{{ url_for('static', filename='img/logo.jpg') }}" alt="Logo Flama Barber" class="logo-login">
        <span class="badge">Panel de control</span>
        <h1>Flama Barber</h1>
        <p class="subtitulo">Ingresá tus datos para acceder al panel.</p>

        {% if error %}
            <div class="alerta-error">{{ error }}</div>
        {% endif %}

        <form method="post" action="{{ url_for('admin_login') }}" class="login-form">
            <div class="campo">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" required autofocus>
            </div>

            <div class="campo">
                <label for="contrasena">Contraseña</label>
                <div class="campo-contrasena-control">
                    <input type="password" id="contrasena" name="contrasena" required>
                    <button type="button" id="alternarContrasena" class="boton-ver-contrasena" aria-label="Mostrar contraseña">
                        Ver
                    </button>
                </div>
            </div>

            <button type="submit" class="boton-admin">Iniciar sesión</button>
        </form>

        <a href="{{ url_for('inicio') }}" class="volver-sitio">Volver al sitio de clientes</a>
    </div>
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
