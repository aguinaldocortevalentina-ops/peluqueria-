<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flama Barber</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="portada">
        <p class="detalle">BARBERÍA</p>
        <h1>Flama Barber</h1>
        <div class="linea-dorada"></div>
        <p class="mensaje">Estilo, precisión y tradición.</p>

        <section class="servicios">
            <h2>Nuestros servicios</h2>
            <ul>
                {% for servicio in servicios %}
                    <li>
                        <span>{{ servicio.nombre }}</span>
                        <strong>${{ "{:,}".format(servicio.precio).replace(",", ".") }}</strong>
                    </li>
                {% endfor %}
            </ul>
        </section>
    </main>
</body>
</html>
